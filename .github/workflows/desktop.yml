name: Desktop validation

# Only run on a dedicated disposable VM with an unlocked interactive Windows desktop.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: [self-hosted, Windows, X64, interactive-desktop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Run native and packaged-app interactive suites
        shell: pwsh
        run: ./build.ps1
