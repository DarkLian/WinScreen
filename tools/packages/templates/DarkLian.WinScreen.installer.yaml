# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json
PackageIdentifier: DarkLian.WinScreen
PackageVersion: {{VERSION}}
MinimumOSVersion: 10.0.19041.0
InstallerType: exe
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
